<style>
  :root{
    /* ---- Luxury Gradient Modern palette (shared with the Gateway Library) ---- */
    --bg:#0a0a1a; --bg2:#12122e;
    --primary:#8b7bf0; --primary-2:#5a4bd0; --secondary:#5ad1e0; --gold:#e8c06a;
    --acc:#8b7bf0;   /* alias kept for chart series that reference the accent */
    /* glass surfaces */
    --surface:rgba(255,255,255,.045); --surface-2:rgba(255,255,255,.075);
    --surface-strong:rgba(20,18,46,.72);
    --border:rgba(160,160,255,.14); --border-2:rgba(160,160,255,.30);
    /* text (contrast-checked on the dark mesh) */
    --text:#ececf7; --text-muted:#a6a6c8; --text-dim:#8686ab;
    /* brainwave band language, matched to the Library's frequency chips */
    --delta:#8b7bf0; --theta:#c9bcff; --alpha:#5ad1e0; --beta:#e8c06a; --gamma:#f0a889;
    --hr:#ff7aa8; --good:#5ad1e0; --ok:#e8c06a; --bad:#f0708f;
    --shadow:0 18px 50px -20px rgba(0,0,0,.7);
    --ring:0 0 0 3px rgba(139,123,240,.55);
    --r:18px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;color:var(--text);min-height:100vh;
    font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:clamp(13.5px,.4vw + 12.5px,15px);line-height:1.55;-webkit-font-smoothing:antialiased;
    background:
      radial-gradient(1100px 780px at 12% -8%, #2a1e57 0%, transparent 56%),
      radial-gradient(1000px 720px at 100% 0%, #0e3040 0%, transparent 52%),
      radial-gradient(900px 700px at 60% 120%, #1c1746 0%, transparent 55%),
      var(--bg);
    background-attachment:fixed;padding-bottom:80px}
  a{color:inherit}
  :focus-visible{outline:none;box-shadow:var(--ring);border-radius:10px}
  ::selection{background:rgba(90,209,224,.28)}
  .skip{position:absolute;left:-999px;top:8px;background:var(--primary);color:#fff;padding:8px 14px;
    border-radius:10px;z-index:200;text-decoration:none}
  .skip:focus{left:12px}

  /* ---- shared app nav ---- */
  .appnav{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:14px;
    padding:11px clamp(14px,3vw,28px);
    background:linear-gradient(180deg,rgba(10,10,26,.9),rgba(10,10,26,.62));
    backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);
    border-bottom:1px solid var(--border)}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.3px;font-size:14.5px;margin-right:6px}
  .brand svg{width:22px;height:22px;flex:none}
  .brand b{background:linear-gradient(90deg,var(--primary),var(--secondary));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .appnav .spacer{flex:1}
  .navlink{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:12px;
    border:1px solid var(--border);background:var(--surface);color:var(--text-muted);
    text-decoration:none;font-size:13px;font-weight:550;transition:.16s;white-space:nowrap}
  .navlink:hover{background:var(--surface-2);color:var(--text);border-color:var(--border-2);transform:translateY(-1px)}
  .navlink[aria-current="page"]{color:#fff;border-color:transparent;
    background:linear-gradient(135deg,var(--primary),var(--primary-2));box-shadow:0 6px 18px -6px rgba(120,100,240,.6)}

  /* ---- hero ---- */
  header.hero{padding:clamp(22px,4vw,40px) clamp(16px,3vw,28px) 8px;max-width:1180px;margin:0 auto}
  h1{margin:0;font-weight:750;letter-spacing:.3px;font-size:clamp(24px,3.4vw,38px);
    background:linear-gradient(92deg,#c9bcff 0%,#b9a8ff 40%,#7be0ec 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--text-muted);font-size:clamp(12.5px,.9vw,13.5px);margin-top:8px;max-width:760px}
  .wrap{max-width:1180px;margin:0 auto;padding:0 clamp(14px,3vw,28px) 40px}

  /* ---- tabs ---- */
  .tabs{display:flex;flex-wrap:wrap;gap:9px;margin:20px 0 6px}
  .tab{background:var(--surface);border:1px solid var(--border);color:var(--text-muted);
    padding:9px 15px;border-radius:13px;cursor:pointer;font-size:13px;font-weight:550;white-space:nowrap;
    transition:.16s;font-family:inherit}
  .tab:hover{background:var(--surface-2);color:var(--text);border-color:var(--border-2);transform:translateY(-1px)}
  .tab[aria-selected="true"],.tab.active{color:#fff;border-color:transparent;
    background:linear-gradient(135deg,var(--primary),var(--primary-2));box-shadow:0 8px 20px -8px rgba(120,100,240,.65)}

  /* ---- glass surfaces ---- */
  .glass, .panel, .card, .gcard, .note{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
    backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
    box-shadow:var(--shadow)}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:13px;margin:18px 0}
  .card{padding:15px 17px;position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;
    background:linear-gradient(90deg,var(--primary),var(--secondary));opacity:.55}
  .card .k{color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:.7px;font-weight:600}
  .card .v{font-size:clamp(22px,2.4vw,27px);font-weight:700;margin-top:7px;letter-spacing:.2px}
  .card .v small{font-size:13px;color:var(--text-muted);font-weight:400}
  .panel{padding:18px 20px;margin:16px 0}
  .panel h2{margin:0 0 3px;font-size:clamp(14.5px,1.4vw,16.5px);font-weight:650}
  .panel p.cap{margin:0 0 14px;color:var(--text-muted);font-size:12.5px;max-width:80ch}
  .chartbox{position:relative;height:clamp(260px,38vw,310px)}
  .chartbox.tall{height:clamp(300px,42vw,350px)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:820px){.row2{grid-template-columns:1fr}}
  .controls{display:flex;align-items:center;gap:11px;margin:10px 0 16px;flex-wrap:wrap}
  .controls label{color:var(--text-muted);font-size:12.5px;font-weight:550}
  input[type=range]{accent-color:var(--primary);cursor:pointer}
  .listen{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:12px;border:none;
    cursor:pointer;font-size:13px;font-weight:650;font-family:inherit;color:#08131a;
    background:linear-gradient(135deg,var(--secondary),#7be0ec);
    box-shadow:0 8px 20px -8px rgba(90,209,224,.7);transition:.16s;text-decoration:none}
  .listen:hover{transform:translateY(-1px);filter:brightness(1.06)}
  .listen.small{padding:6px 12px;font-size:12px}
  .note{padding:15px 19px;color:#d7d7ef;font-size:13px;
    background:linear-gradient(180deg,rgba(139,123,240,.10),rgba(90,209,224,.05)),var(--surface)}
  .note b{color:#fff}
  .pill{display:inline-flex;align-items:center;padding:2px 10px;border-radius:20px;font-size:11.5px;
    margin-left:8px;font-weight:600}
  .pill.good{background:rgba(90,209,224,.15);color:#8fe6f0;border:1px solid rgba(90,209,224,.4)}
  .pill.ok{background:rgba(232,192,106,.15);color:#f0d089;border:1px solid rgba(232,192,106,.4)}
  .pill.bad{background:rgba(240,112,143,.15);color:#f5a3b6;border:1px solid rgba(240,112,143,.4)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:right;padding:9px 11px;border-bottom:1px solid var(--border)}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--text-muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  tbody tr{transition:.12s}
  tbody tr:hover{background:var(--surface-2)}
  .err{padding:40px;text-align:center;color:var(--text-muted)}
  .hint{color:var(--text-dim);font-size:12px;margin-top:2px}
  /* ---- guide ---- */
  .gcard{padding:17px 19px;margin:14px 0}
  .gcard h3{margin:0;font-size:15px;font-weight:650;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .gcard .meta{color:var(--text-muted);font-size:12px;margin:5px 0 11px}
  .gcard .desc{color:#d7d7ef;font-size:13px;margin:0 0 11px}
  .ck{display:flex;gap:11px;align-items:flex-start;padding:8px 9px;border-radius:11px;cursor:pointer;transition:.12s}
  .ck:hover{background:var(--surface-2)}
  .ck input{margin-top:2px;width:16px;height:16px;accent-color:var(--secondary);cursor:pointer;flex:none}
  .ck span{font-size:13px;color:#e2e2f4}
  .ck.done span{color:var(--text-dim);text-decoration:line-through}
  .pbar{height:9px;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:8px;
    overflow:hidden;margin-top:10px}
  .pbar div{height:100%;background:linear-gradient(90deg,var(--secondary),var(--primary));transition:width .4s}
  .prep li{margin:5px 0;color:#d7d7ef;font-size:13px}
  details.faq{border-top:1px solid var(--border);padding:9px 2px}
  details.faq summary{cursor:pointer;color:#e2e2f4;font-size:13px;font-weight:600}
  details.faq summary::marker{color:var(--secondary)}
  details.faq p{color:var(--text-muted);font-size:12.5px;margin:8px 0 2px}
  code{background:rgba(255,255,255,.07);padding:1px 6px;border-radius:6px;font-size:12px}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important;
      scroll-behavior:auto!important}
  }
</style>
</head>

    var bust = (location.protocol.indexOf('http')===0) ? ('?v='+Date.now()) : '';

<script>

const WAVES = {
  1:{name:'Wave 1 · Discovery', tag:'Focus 10 — mind awake, body asleep',
     intro:'The foundation: learn to clear the mind, gather energy, and reach Focus 10. Distilled from the Discovery Manual.',

const ALL_TAPES = [...WAVE1_TAPES, ...WAVE2_TAPES];
const ckKey = (tape,i) => `gw1ck|${tape}|${i}`;       // tape names are unique across waves
const ckGet = (tape,i) => localStorage.getItem(ckKey(tape,i)) === '1';
const ckSet = (tape,i,v) => localStorage.setItem(ckKey(tape,i), v?'1':'0');
function guideFor(label){ return ALL_TAPES.find(g => label.includes(g.tape)) || null; }
function waveOf(label){ const m=/Wave\s*(\d+)/.exec(label); return m?+m[1]:1; }
// which app the tape was played on (e.g. "Expand"); blank = the FLAC Library
function srcOf(s){ return s && s.source ? s.source : ''; }
function srcSuffix(s, sep=' · '){ const v=srcOf(s); return v?sep+v:''; }
function latestRecordedWave(){
  let w=1; (DATA?.sessions||[]).forEach(s=>{ w=Math.max(w, waveOf(s.label)); });
  return WAVES[w] ? w : 1;
}
let guideWave = 1;

Chart.defaults.color = '#a6a6c8';
Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
Chart.defaults.borderColor = 'rgba(160,160,255,.11)';
if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
  Chart.defaults.animation = false;
}

let DATA = window.GATEWAY_DATA || null;
let charts = [];

function destroyCharts(){ charts.forEach(c=>c.destroy()); charts = []; }

// moving-average smoothing + striding for plot performance
function smooth(arr, win){
  if(win<=1) return arr.slice();
  const out=new Array(arr.length); let q=[],s=0,cnt=0;
  for(let i=0;i<arr.length;i++){
    const v=arr[i];
    if(v==null){ out[i]=null; continue; }
    q.push(v); s+=v; cnt++;
    if(q.length>win){ const r=q.shift(); if(r!=null){s-=r;cnt--;} }
    out[i]= s/cnt;
  }
  return out;
}
function stride(arr, step){ const o=[]; for(let i=0;i<arr.length;i+=step)o.push(arr[i]); return o; }

// accessible text alternative for a canvas chart, from its panel heading + series
function labelCanvas(ctx, datasets){
  const head = ctx.closest('.panel,.row2')?.querySelector('h2')?.textContent || 'Chart';
  const series = (datasets||[]).map(d=>d.label).filter(Boolean).join(', ');
  ctx.setAttribute('role','img');
  ctx.setAttribute('aria-label', series ? `${head}: ${series} over time` : head);
}

function lineChart(ctx, datasets, opts={}){
  const c = new Chart(ctx, {type:'line', data:{datasets},
    options:Object.assign({
      responsive:true, maintainAspectRatio:false, animation:false,
      interaction:{mode:'index', intersect:false},
      elements:{point:{radius:0}, line:{borderWidth:1.8, tension:.25}},
      scales:{
        x:{type:'linear', title:{display:true,text:'minutes'}, ticks:{maxTicksLimit:9, callback:v=>(+v).toFixed(0)}},
        y:opts.y||{}
      },
      plugins:{legend:{display:opts.legend!==false, labels:{boxWidth:12,usePointStyle:true}},
        tooltip:{callbacks:{title:i=>'t = '+(i[0].parsed.x).toFixed(1)+' min'}}}
    }, opts.extra||{})
  });
  labelCanvas(ctx, datasets); charts.push(c); return c;
}
function barChart(ctx, labels, datasets, stacked=false){
  const c=new Chart(ctx,{type:'bar',data:{labels,datasets},
    options:{responsive:true,maintainAspectRatio:false,animation:false,
      scales:{x:{stacked},y:{stacked, ticks:{}}},
      plugins:{legend:{labels:{boxWidth:12,usePointStyle:true}}}}});
  labelCanvas(ctx, datasets); charts.push(c); return c;
}

function fmtPct(x){ return (x*100).toFixed(0)+'%'; }
function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }

function pickWin(n){ return Math.max(1, Math.round(n/60)); }   // ~per-minute smoothing default
function pickStride(n){ return Math.max(1, Math.round(n/600)); }

// ------- guide -------
function checklistEl(tape, goals, onChange){
  const box = document.createElement('div');
  goals.forEach((g,i)=>{
    const row = el(`<label class="ck${ckGet(tape,i)?' done':''}">
      <input type="checkbox" ${ckGet(tape,i)?'checked':''}><span>${g}</span></label>`);
    row.querySelector('input').addEventListener('change', e=>{
      ckSet(tape,i,e.target.checked);
      row.classList.toggle('done', e.target.checked);
      if(onChange) onChange();
    });
    box.appendChild(row);
  });
  return box;
}
function guideProgress(tapes){
  let done=0, total=0;
  tapes.forEach(g=>g.goals.forEach((_,i)=>{ total++; if(ckGet(g.tape,i)) done++; }));
  return {done, total};
}

    toggle.appendChild(b);

  view.appendChild(toggle);

  const head = el(`<div class="panel"><h2>${W.name} — what to accomplish</h2>
    <p class="cap">${W.intro} Tick off what you've genuinely experienced — progress is saved in this browser.</p>
    <div class="pbar"><div id="gprog"></div></div><div class="hint" id="gprogtxt"></div></div>`);
  view.appendChild(head);
  const updateProg = ()=>{
    const p=guideProgress(W.tapes);
    document.getElementById('gprog').style.width=(p.total?100*p.done/p.total:0)+'%';
    document.getElementById('gprogtxt').textContent=`${p.done} of ${p.total} practice goals checked · ${W.tag}`;
  };

  view.appendChild(el(`<div class="gcard"><h3>Before every session</h3>
    <div class="meta">Setup &amp; routine</div>
    <ul class="prep">${W.prep.map(p=>`<li>${p}</li>`).join('')}</ul></div>`));

  W.tapes.forEach((g,gi)=>{
    const takes = DATA.sessions.filter(s=>s.label.includes(g.tape))
                               .sort((a,b)=>(a.take||1)-(b.take||1));
    const sess = takes.length ? takes[takes.length-1] : null;   // latest take
    const status = sess
      ? `<span class="pill good">recorded ${sess.date}${takes.length>1?` · ${takes.length} takes`:''}</span>`
      : (firstUnrecorded[gi] ? `<span class="pill ok">not yet recorded — next up</span>`
                             : `<span class="pill bad">not yet recorded</span>`);
    const card = el(`<div class="gcard">
      <h3>#${gi+1} — ${g.tape} ${status}</h3>
      <div class="meta">${sess ? `${sess.summary.duration_min} min · depth ${fmtPct(sess.summary.depth_mean)} · HR ${sess.summary.hr_mean} bpm` : 'record it, re-run process.py, and it appears here'}</div>
      <p class="desc">${g.desc}</p></div>`);
    card.appendChild(checklistEl(g.tape, g.goals, updateProg));
    card.appendChild(el(`<div class="hint" style="margin-top:8px">📈 On your EEG: ${g.eeg}</div>`));
    view.appendChild(card);
  });

  const faq = el(`<div class="gcard"><h3>Troubleshooting (from the manual's FAQ)</h3><div style="margin-top:8px"></div></div>`);
  W.faqs.forEach(([q,a])=>faq.appendChild(el(`<details class="faq"><summary>${q}</summary><p>${a}</p></details>`)));
  view.appendChild(faq);

  view.appendChild(el(`<div class="note" style="margin-top:18px"><b>Moving on.</b> ${W.closing}</div>`));
  updateProg();
}

// ------- shell -------
function buildTabs(){
  const tabs=document.getElementById('tabs'); tabs.innerHTML='';
  const add=(key,label)=>{
    const b=el(`<button class="tab" role="tab" data-i="${key}" aria-selected="false"
      tabindex="-1" aria-controls="view">${label}</button>`);
    b.addEventListener('click',()=>{ if(key==='guide') guideWave=latestRecordedWave(); select(key); });
    tabs.appendChild(b); return b;
  };
  DATA.sessions.forEach((s,i)=>add(String(i),
    (s.takes_total>1 ? `${s.label} · take ${s.take}` : s.label) + srcSuffix(s,' · ')));
  add('cmp','▣ Compare all sessions');
  add('guide','✦ Gateway Guide');

  // roving-tabindex arrow-key navigation (WAI-ARIA tabs pattern)
  tabs.addEventListener('keydown',e=>{
    const list=[...tabs.querySelectorAll('.tab')];
    let idx=list.indexOf(document.activeElement);
    if(idx<0) return;
    if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
      e.preventDefault();
      idx=(idx+(e.key==='ArrowRight'?1:-1)+list.length)%list.length;
      list[idx].focus();
    } else if(e.key==='Home'){ e.preventDefault(); list[0].focus(); }
    else if(e.key==='End'){ e.preventDefault(); list[list.length-1].focus(); }
  });
}
function select(i, opts={}){
  const tabs=[...document.querySelectorAll('#tabs .tab')];
  tabs.forEach(t=>{
    const on = t.dataset.i==i;
    t.setAttribute('aria-selected', on?'true':'false');
    t.tabIndex = on?0:-1;
  });
  if(i==='cmp') renderCompare(); else if(i==='guide') renderGuide(); else renderSession(DATA.sessions[i]);
  if(opts.focus){ const t=tabs.find(t=>t.dataset.i==i); if(t) t.focus(); }
  if(!opts.noScroll) window.scrollTo({top:0,behavior:'smooth'});
}

// deep link: ?session=<id> or ?ep=<episode_n> selects that tape's session
function sessionIndexFromURL(){
  const q=new URLSearchParams(location.search);
  const id=q.get('session'), ep=q.get('ep');
  if(id){ const i=DATA.sessions.findIndex(s=>s.id===id); if(i>=0) return i; }
  if(ep){ const i=DATA.sessions.findIndex(s=>String(s.episode_n)===String(ep)); if(i>=0) return i; }
  return 0;
}

function init(){
  if(window.__noData || !DATA || !DATA.sessions || !DATA.sessions.length){
    document.getElementById('subtitle').textContent='No data loaded';
    document.getElementById('view').innerHTML =
      '<div class="err">Could not find <code>dashboard_data.js</code>.<br>'+
      'Run <code>python process.py</code>, then refresh.</div>';
    return;
  }
  const n=DATA.sessions.length;
  document.getElementById('subtitle').innerHTML =
    `${n} session${n>1?'s':''} · generated ${DATA.generated} · `+
    `Muse S Athena via Mind Monitor (TP9·AF7·AF8·TP10 + PPG heart rate)`;
  buildTabs();
  select(String(sessionIndexFromURL()));
}
init();
</script>
